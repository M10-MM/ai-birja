<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Birja — биржевые данные и AI-агент</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230b5cff'/%3E%3Cpath d='M3 11l3-3 2 2 5-5' stroke='white' stroke-width='2' fill='none'/%3E%3C/svg%3E">
</head>
<body>
<div class="util">
  <div class="wrap util-in">
    <span class="util-src" data-i18n="util.src"></span>
    <a class="util-link" href="#/listing"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21V5l8-3 8 3v16M9 21v-5h6v5M8 9h.01M12 9h.01M16 9h.01M8 13h.01M12 13h.01M16 13h.01"/></svg><span data-i18n="util.issuer"></span></a>
    <a class="util-btn" href="#/trades"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span data-i18n="util.trade"></span> →</a>
  </div>
</div>
<div class="tape" id="tape" aria-label="ticker"><div class="tape-track" id="tapeTrack"></div></div>

<header class="hdr">
  <div class="wrap hdr-in">
    <a href="#/" class="logo" aria-label="AI Birja">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <g fill="#0b5cff">
          <circle cx="4" cy="22" r="2"/><circle cx="10" cy="22" r="2"/><circle cx="16" cy="22" r="2"/><circle cx="22" cy="22" r="2"/>
          <circle cx="10" cy="16" r="2"/><circle cx="16" cy="16" r="2"/><circle cx="22" cy="16" r="2"/><circle cx="26" cy="16" r="2" opacity=".5"/>
          <circle cx="16" cy="10" r="2"/><circle cx="22" cy="10" r="2"/><circle cx="22" cy="4" r="2" opacity=".5"/>
        </g>
      </svg>
      <span><b>AI BIRJA</b><small>DATA · EXCHANGE · AGENT</small></span>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="hdr-right">
      <button class="btn-search" id="searchBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span data-i18n="search"></span></button>
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="ru">RU</button><button data-lang="en">EN</button>
      </div>
      <div class="acct">
        <button class="btn-acct" id="acctBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span id="acctLabel"></span></button>
        <div class="pop" id="loginPop" hidden>
          <form id="popLogin" class="pop-form">
            <select name="role" required>
              <option value="" data-i18n="auth.choose"></option>
              <option value="investor" data-i18n="role.investor"></option>
              <option value="broker" data-i18n="role.broker"></option>
              <option value="participant" data-i18n="role.participant"></option>
            </select>
            <input name="login" autocomplete="username" data-i18n-ph="auth.login" required>
            <input name="password" type="password" autocomplete="current-password" data-i18n-ph="auth.password" required>
            <div class="form-err" hidden></div>
            <button class="btn-green" data-i18n="auth.signin"></button>
            <a href="#/cabinet?forgot" class="pop-link green" data-i18n="auth.forgot"></a>
            <a href="#/cabinet?register" class="pop-link" data-i18n="auth.register"></a>
          </form>
        </div>
      </div>
      <button class="burger" id="burger" aria-label="menu"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<div class="search-ov" id="searchOv" hidden>
  <div class="search-box wrap">
    <input id="searchIn" autocomplete="off">
    <button class="search-x" id="searchX" aria-label="close">✕</button>
    <div class="search-res" id="searchRes"></div>
  </div>
</div>

<main id="app" class="wrap"></main>

<footer class="ftr" id="ftr"></footer>

<script src="/static/app.js?v=4"></script>
</body>
</html>
